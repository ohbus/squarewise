spring:
  application:
    name: expense-core
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SQUAREWISE_SECURITY_OIDC_ISSUER_URI:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    publisher-confirm-type: correlated
    template:
      mandatory: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  health:
    redis:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: expense-core

squarewise:
  db:
    enabled: ${SQUAREWISE_DB_ENABLED:false}
    writer:
      url: ${SQUAREWISE_DB_WRITER_URL:${SPRING_DATASOURCE_URL:}}
      username: ${SQUAREWISE_DB_WRITER_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
      password: ${SQUAREWISE_DB_WRITER_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
      maximum-pool-size: ${SQUAREWISE_DB_WRITER_MAX_POOL_SIZE:10}
      connection-timeout-ms: ${SQUAREWISE_DB_WRITER_CONNECTION_TIMEOUT_MS:2000}
      max-lifetime-ms: ${SQUAREWISE_DB_WRITER_MAX_LIFETIME_MS:1800000}
    readers:
      search:
        url: ${SQUAREWISE_DB_READER_SEARCH_URL:}
        username: ${SQUAREWISE_DB_READER_SEARCH_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
        password: ${SQUAREWISE_DB_READER_SEARCH_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
        maximum-pool-size: ${SQUAREWISE_DB_READER_SEARCH_MAX_POOL_SIZE:5}
        connection-timeout-ms: ${SQUAREWISE_DB_READER_SEARCH_CONNECTION_TIMEOUT_MS:2000}
        max-lifetime-ms: ${SQUAREWISE_DB_READER_SEARCH_MAX_LIFETIME_MS:1800000}
  security:
    oidc:
      audience: ${SQUAREWISE_SECURITY_OIDC_AUDIENCE:}
  outbox:
    enabled: false
    batch-size: 100
    poll-delay-ms: 1000
    lease-seconds: 30
    max-attempts: 5
    retry-after-seconds: 5
