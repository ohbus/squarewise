spring:
  application:
    name: bff
  codec:
    max-in-memory-size: ${SQUAREWISE_BFF_MAX_BODY_SIZE:256KB}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SQUAREWISE_SECURITY_OIDC_ISSUER_URI:}
  graphql:
    path: /graphql
    schema:
      locations: classpath:graphql/
    websocket:
      path: /graphql

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: bff

server:
  max-http-request-header-size: ${SQUAREWISE_BFF_MAX_HEADER_SIZE:16KB}

squarewise:
  bff:
    rate-limit:
      enabled: ${SQUAREWISE_BFF_RATE_LIMIT_ENABLED:true}
  accounts-url: ${SQUAREWISE_ACCOUNTS_URL}
  expense-core-url: ${SQUAREWISE_EXPENSE_CORE_URL}
  security:
    oidc:
      audience: ${SQUAREWISE_SECURITY_OIDC_AUDIENCE:}
    browser:
      session:
        access-cookie-name: ${SQUAREWISE_SECURITY_BROWSER_ACCESS_COOKIE:squarewise_access}
        refresh-cookie-name: ${SQUAREWISE_SECURITY_BROWSER_REFRESH_COOKIE:squarewise_refresh}
        csrf-cookie-name: ${SQUAREWISE_SECURITY_BROWSER_CSRF_COOKIE:squarewise_csrf}
        cookie-max-age: ${SQUAREWISE_SECURITY_BROWSER_COOKIE_MAX_AGE:30d}
