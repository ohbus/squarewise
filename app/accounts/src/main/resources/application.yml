spring:
  application:
    name: accounts
  data:
    redis:
      host: ${SQUAREWISE_REDIS_HOST}
      port: ${SQUAREWISE_REDIS_PORT:6379}
      password: ${SQUAREWISE_REDIS_PASSWORD}
      ssl:
        enabled: ${SQUAREWISE_REDIS_SSL_ENABLED:false}
      connect-timeout: ${SQUAREWISE_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${SQUAREWISE_REDIS_COMMAND_TIMEOUT:2s}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SQUAREWISE_SECURITY_OIDC_ISSUER_URI:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,rateLimitRedis
  metrics:
    tags:
      service: accounts

squarewise:
  db:
    enabled: ${SQUAREWISE_DB_ENABLED:false}
    writer:
      url: ${SQUAREWISE_DB_WRITER_URL:${SPRING_DATASOURCE_URL:}}
      username: ${SQUAREWISE_DB_WRITER_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
      password: ${SQUAREWISE_DB_WRITER_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
      maximum-pool-size: ${SQUAREWISE_DB_WRITER_MAX_POOL_SIZE:10}
      connection-timeout-ms: ${SQUAREWISE_DB_WRITER_CONNECTION_TIMEOUT_MS:2000}
      max-lifetime-ms: ${SQUAREWISE_DB_WRITER_MAX_LIFETIME_MS:1800000}
    readers:
      profile:
        url: ${SQUAREWISE_DB_READER_PROFILE_URL:}
        username: ${SQUAREWISE_DB_READER_PROFILE_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
        password: ${SQUAREWISE_DB_READER_PROFILE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
        maximum-pool-size: ${SQUAREWISE_DB_READER_PROFILE_MAX_POOL_SIZE:5}
        connection-timeout-ms: ${SQUAREWISE_DB_READER_PROFILE_CONNECTION_TIMEOUT_MS:2000}
        max-lifetime-ms: ${SQUAREWISE_DB_READER_PROFILE_MAX_LIFETIME_MS:1800000}
  security:
    oidc:
      audience: ${SQUAREWISE_SECURITY_OIDC_AUDIENCE:}
      external-validation-enabled: ${SQUAREWISE_SECURITY_OIDC_EXTERNAL_VALIDATION_ENABLED:false}
    session:
      access-token-lifetime: ${SQUAREWISE_SECURITY_SESSION_ACCESS_TOKEN_LIFETIME:10m}
      refresh-idle-lifetime: ${SQUAREWISE_SECURITY_SESSION_REFRESH_IDLE_LIFETIME:30d}
      absolute-session-lifetime: ${SQUAREWISE_SECURITY_SESSION_ABSOLUTE_LIFETIME:90d}
      clock-skew: ${SQUAREWISE_SECURITY_SESSION_CLOCK_SKEW:30s}
