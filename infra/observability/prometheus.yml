global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/squarewise.yml
  - /etc/prometheus/alerts/error-rules.yml

scrape_configs:
  - job_name: squarewise
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - accounts:8080
          - expense-core:8080
          - notifications:8080
          - bff:8080
        labels:
          environment: production
