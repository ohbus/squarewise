x-invalid-subject-oidc-issuer: &invalid_subject_oidc_issuer ${SQUAREWISE_INVALID_SUBJECT_OIDC_ISSUER:-http://invalid-subject-oidc:8080}

services:
  invalid-subject-oidc:
    build:
      context: ../..
      dockerfile: tests/fixtures/invalid_subject_oidc/Dockerfile
    ports: ["127.0.0.1:${INVALID_SUBJECT_HOST_PORT:-28091}:8080"]
    environment:
      INVALID_SUBJECT_OIDC_ISSUER: *invalid_subject_oidc_issuer
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/.well-known/openid-configuration')"]
      interval: 2s
      timeout: 2s
      retries: 20
  accounts:
    environment:
      SQUAREWISE_SECURITY_OIDC_ISSUER_URI: *invalid_subject_oidc_issuer
    depends_on:
      invalid-subject-oidc: {condition: service_healthy}
  expense-core:
    environment:
      SQUAREWISE_SECURITY_OIDC_ISSUER_URI: *invalid_subject_oidc_issuer
    depends_on:
      invalid-subject-oidc: {condition: service_healthy}
  notifications:
    environment:
      SQUAREWISE_SECURITY_OIDC_ISSUER_URI: *invalid_subject_oidc_issuer
    depends_on:
      invalid-subject-oidc: {condition: service_healthy}
  bff:
    environment:
      SQUAREWISE_SECURITY_OIDC_ISSUER_URI: *invalid_subject_oidc_issuer
    depends_on:
      invalid-subject-oidc: {condition: service_healthy}
