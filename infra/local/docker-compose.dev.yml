services:
  postgres:
    extends: {file: docker-compose.yml, service: postgres}
  rabbitmq:
    extends: {file: docker-compose.yml, service: rabbitmq}
  redis:
    extends: {file: docker-compose.yml, service: redis}
  mailpit:
    extends: {file: docker-compose.yml, service: mailpit}
  idp-keycloak:
    extends: {file: docker-compose.yml, service: idp-keycloak}
  accounts:
    hostname: accounts-api
    deploy:
      resources:
        reservations: {cpus: "0.25", memory: 192m}
        limits: {cpus: "1.00", memory: 512m}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.fast
      args: {APP_PROJECT: accounts}
    environment:
      SPRING_PROFILES_ACTIVE: local-oidc
      SQUAREWISE_SECURITY_OIDC_ISSUER_URI: ${SQUAREWISE_SECURITY_OIDC_ISSUER_URI:-http://${SQUAREWISE_IDP_HOSTNAME:-idp-keycloak}:8080/realms/${KEYCLOAK_REALM:-squarewise}}
      SQUAREWISE_SECURITY_OIDC_AUDIENCE: ${SQUAREWISE_SECURITY_OIDC_AUDIENCE:-squarewise-api}
      SQUAREWISE_SECURITY_OIDC_EXTERNAL_VALIDATION_ENABLED: ${SQUAREWISE_SECURITY_OIDC_EXTERNAL_VALIDATION_ENABLED:-true}
      SQUAREWISE_SECURITY_BROWSER_ALLOWED_ORIGINS: ${SQUAREWISE_SECURITY_BROWSER_ALLOWED_ORIGINS:-}
      SQUAREWISE_SECURITY_CREDENTIAL_DIGEST_SECRET: ${SQUAREWISE_SECURITY_CREDENTIAL_DIGEST_SECRET:?Set a unique base64 credential digest secret}
      SQUAREWISE_SECURITY_AUTH_EMAIL_ENVELOPE_KEY: ${SQUAREWISE_SECURITY_AUTH_EMAIL_ENVELOPE_KEY:?Set a unique base64 auth email envelope key}
      SQUAREWISE_REDIS_HOST: ${SQUAREWISE_REDIS_HOSTNAME:-rate-limit-redis}
      SQUAREWISE_REDIS_PASSWORD: ${REDIS_PASSWORD:-squarewise-redis-local-only}
      SPRING_RABBITMQ_HOST: ${SQUAREWISE_RABBITMQ_HOSTNAME:-message-broker}
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-squarewise}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-squarewise-local-only}
      SQUAREWISE_AUTH_EMAIL_OUTBOX_ENABLED: "true"
      SQUAREWISE_AUTH_EMAIL_OUTBOX_EXCHANGE: squarewise.events
      SQUAREWISE_AUTH_EMAIL_OUTBOX_ROUTING_KEY: auth.email.requested.v1
      SPRING_DATASOURCE_URL: jdbc:postgresql://${SQUAREWISE_POSTGRES_HOSTNAME:-postgres-db}:5432/squarewise_accounts
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-squarewise}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-squarewise-local-only}
    ports: ["${SQUAREWISE_ACCOUNTS_PORT:-28081}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}, redis: {condition: service_healthy}, idp-keycloak: {condition: service_healthy}}
  expense-core:
    hostname: expense-core-api
    deploy:
      resources:
        reservations: {cpus: "0.50", memory: 256m}
        limits: {cpus: "1.50", memory: 768m}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.fast
      args: {APP_PROJECT: expense-core}
    environment:
      SPRING_PROFILES_ACTIVE: local-oidc
      SQUAREWISE_SECURITY_OIDC_ISSUER_URI: ${SQUAREWISE_SECURITY_OIDC_ISSUER_URI:-http://${SQUAREWISE_IDP_HOSTNAME:-idp-keycloak}:8080/realms/${KEYCLOAK_REALM:-squarewise}}
      SQUAREWISE_SECURITY_OIDC_AUDIENCE: ${SQUAREWISE_SECURITY_OIDC_AUDIENCE:-squarewise-api}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${SQUAREWISE_POSTGRES_HOSTNAME:-postgres-db}:5432/squarewise_expense_core
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-squarewise}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-squarewise-local-only}
      SPRING_RABBITMQ_HOST: ${SQUAREWISE_RABBITMQ_HOSTNAME:-message-broker}
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-squarewise}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-squarewise-local-only}
      SQUAREWISE_OUTBOX_ENABLED: "true"
      SQUAREWISE_OUTBOX_RABBIT_ENABLED: "true"
    ports: ["${SQUAREWISE_EXPENSE_CORE_PORT:-28082}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}, idp-keycloak: {condition: service_healthy}}
  notifications:
    hostname: notifications-api
    deploy:
      resources:
        reservations: {cpus: "0.25", memory: 192m}
        limits: {cpus: "1.00", memory: 512m}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.fast
      args: {APP_PROJECT: notifications}
    environment:
      SPRING_PROFILES_ACTIVE: local-oidc
      SQUAREWISE_SECURITY_OIDC_ISSUER_URI: ${SQUAREWISE_SECURITY_OIDC_ISSUER_URI:-http://${SQUAREWISE_IDP_HOSTNAME:-idp-keycloak}:8080/realms/${KEYCLOAK_REALM:-squarewise}}
      SQUAREWISE_SECURITY_OIDC_AUDIENCE: ${SQUAREWISE_SECURITY_OIDC_AUDIENCE:-squarewise-api}
      SQUAREWISE_SECURITY_AUTH_EMAIL_ENVELOPE_KEY: ${SQUAREWISE_SECURITY_AUTH_EMAIL_ENVELOPE_KEY:?Set a unique base64 auth email envelope key}
      SQUAREWISE_SECURITY_CREDENTIAL_DIGEST_SECRET: ${SQUAREWISE_SECURITY_CREDENTIAL_DIGEST_SECRET:?Set a unique base64 credential digest secret}
      SQUAREWISE_REDIS_HOST: ${SQUAREWISE_REDIS_HOSTNAME:-rate-limit-redis}
      SQUAREWISE_REDIS_PASSWORD: ${REDIS_PASSWORD:-squarewise-redis-local-only}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${SQUAREWISE_POSTGRES_HOSTNAME:-postgres-db}:5432/squarewise_notifications
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-squarewise}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-squarewise-local-only}
      SPRING_RABBITMQ_HOST: ${SQUAREWISE_RABBITMQ_HOSTNAME:-message-broker}
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-squarewise}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-squarewise-local-only}
      SQUAREWISE_NOTIFICATIONS_EMAIL_HOST: ${SQUAREWISE_MAILPIT_HOSTNAME:-mailpit-email}
      SQUAREWISE_NOTIFICATIONS_EMAIL_PORT: ${MAILPIT_SMTP_PORT:-1025}
      SQUAREWISE_NOTIFICATIONS_EMAIL_FROM_ADDRESS: ${SQUAREWISE_NOTIFICATIONS_EMAIL_FROM_ADDRESS:-notifications@squarewise.local}
      SQUAREWISE_NOTIFICATIONS_EMAIL_ENABLED: "true"
    ports: ["${SQUAREWISE_NOTIFICATIONS_PORT:-28083}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}, redis: {condition: service_healthy}, mailpit: {condition: service_healthy}, idp-keycloak: {condition: service_healthy}}
  bff:
    hostname: squarewise-bff
    deploy:
      resources:
        reservations: {cpus: "0.25", memory: 192m}
        limits: {cpus: "1.00", memory: 512m}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.fast
      args: {APP_PROJECT: bff}
    environment:
      SPRING_PROFILES_ACTIVE: local-oidc
      SQUAREWISE_SECURITY_OIDC_ISSUER_URI: ${SQUAREWISE_SECURITY_OIDC_ISSUER_URI:-http://${SQUAREWISE_IDP_HOSTNAME:-idp-keycloak}:8080/realms/${KEYCLOAK_REALM:-squarewise}}
      SQUAREWISE_SECURITY_OIDC_AUDIENCE: ${SQUAREWISE_SECURITY_OIDC_AUDIENCE:-squarewise-api}
      SQUAREWISE_SECURITY_CREDENTIAL_DIGEST_SECRET: ${SQUAREWISE_SECURITY_CREDENTIAL_DIGEST_SECRET:?Set a unique base64 credential digest secret}
      SPRING_RABBITMQ_HOST: ${SQUAREWISE_RABBITMQ_HOSTNAME:-message-broker}
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-squarewise}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-squarewise-local-only}
      SQUAREWISE_EXPENSE_CORE_URL: ${SQUAREWISE_EXPENSE_CORE_URL:-http://expense-core-api:8080}
      SQUAREWISE_ACCOUNTS_URL: ${SQUAREWISE_ACCOUNTS_URL:-http://accounts-api:8080}
      SQUAREWISE_BFF_MESSAGING_ENABLED: "true"
    ports: ["${SQUAREWISE_BFF_PORT:-28080}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on: {accounts: {condition: service_healthy}, expense-core: {condition: service_healthy}, notifications: {condition: service_healthy}, idp-keycloak: {condition: service_healthy}}

volumes:
  postgres-data:

networks:
  default:
    name: squarewise-local-net
