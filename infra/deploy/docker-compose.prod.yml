x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health/readiness | grep -q 'UP'"]
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 30s

x-app-deploy: &app-deploy
  replicas: ${SQUAREWISE_APP_REPLICAS:-3}
  resources:
    limits:
      cpus: ${SQUAREWISE_APP_CPU_LIMIT:-4.0}
      memory: ${SQUAREWISE_APP_MEMORY_LIMIT:-8G}
    reservations:
      cpus: ${SQUAREWISE_APP_CPU_RESERVATION:-1.0}
      memory: ${SQUAREWISE_APP_MEMORY_RESERVATION:-2G}

x-service-defaults: &service-defaults
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  security_opt: [no-new-privileges:true]
  deploy: *app-deploy
  networks: [private]
  init: true
  environment:
    SPRING_PROFILES_ACTIVE: production
    SPRING_MAIN_BANNER_MODE: "off"
    LOGGING_STRUCTURED_FORMAT: ${SQUAREWISE_LOG_FORMAT:-ecs}
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
    MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    MANAGEMENT_SERVER_SHUTDOWN: graceful
    SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 20s
    SQUAREWISE_REDIS_HOST: ${SQUAREWISE_REDIS_HOST:?set SQUAREWISE_REDIS_HOST}
    SQUAREWISE_REDIS_PORT: ${SQUAREWISE_REDIS_PORT:-6379}
    SQUAREWISE_REDIS_PASSWORD: ${SQUAREWISE_REDIS_PASSWORD:?set SQUAREWISE_REDIS_PASSWORD}
    SQUAREWISE_REDIS_SSL_ENABLED: ${SQUAREWISE_REDIS_SSL_ENABLED:?set SQUAREWISE_REDIS_SSL_ENABLED}
    SQUAREWISE_SECURITY_CREDENTIAL_DIGEST_SECRET: ${SQUAREWISE_SECURITY_CREDENTIAL_DIGEST_SECRET:?set SQUAREWISE_SECURITY_CREDENTIAL_DIGEST_SECRET}

services:
  accounts:
    image: ${SQUAREWISE_ACCOUNTS_IMAGE:?set SQUAREWISE_ACCOUNTS_IMAGE}
    <<: *service-defaults
    healthcheck: *healthcheck
  expense-core:
    image: ${SQUAREWISE_EXPENSE_CORE_IMAGE:?set SQUAREWISE_EXPENSE_CORE_IMAGE}
    <<: *service-defaults
    healthcheck: *healthcheck
  notifications:
    image: ${SQUAREWISE_NOTIFICATIONS_IMAGE:?set SQUAREWISE_NOTIFICATIONS_IMAGE}
    <<: *service-defaults
    healthcheck: *healthcheck
  bff:
    image: ${SQUAREWISE_BFF_IMAGE:?set SQUAREWISE_BFF_IMAGE}
    <<: *service-defaults
    healthcheck: *healthcheck

networks:
  private:
    internal: true
