# Production-like single-host staging overlay. Use with docker-compose.prod.yml.
# All image and credential values must be supplied by the deployment environment.
services:
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-squarewise}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    networks: [private]

  rabbitmq:
    image: ${RABBITMQ_IMAGE:?set RABBITMQ_IMAGE}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    networks: [private]

  accounts:
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-squarewise}_accounts
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SQUAREWISE_AUTH_EMAIL_OUTBOX_ENABLED: ${SQUAREWISE_AUTH_EMAIL_OUTBOX_ENABLED:?set SQUAREWISE_AUTH_EMAIL_OUTBOX_ENABLED}
    depends_on:
      postgres: {condition: service_healthy}

  expense-core:
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-squarewise}_expense_core
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?set RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      SQUAREWISE_OUTBOX_ENABLED: ${SQUAREWISE_OUTBOX_ENABLED:?set SQUAREWISE_OUTBOX_ENABLED}
      SQUAREWISE_OUTBOX_RABBIT_ENABLED: ${SQUAREWISE_OUTBOX_RABBIT_ENABLED:?set SQUAREWISE_OUTBOX_RABBIT_ENABLED}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  notifications:
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-squarewise}_notifications
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?set RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  bff:
    environment:
      SQUAREWISE_ACCOUNTS_URL: ${SQUAREWISE_ACCOUNTS_URL:?set SQUAREWISE_ACCOUNTS_URL}
      SQUAREWISE_EXPENSE_CORE_URL: ${SQUAREWISE_EXPENSE_CORE_URL:?set SQUAREWISE_EXPENSE_CORE_URL}
      SQUAREWISE_NOTIFICATIONS_URL: ${SQUAREWISE_NOTIFICATIONS_URL:?set SQUAREWISE_NOTIFICATIONS_URL}
    depends_on:
      accounts: {condition: service_healthy}
      expense-core: {condition: service_healthy}
      notifications: {condition: service_healthy}

  prometheus:
    image: ${PROMETHEUS_IMAGE:?set PROMETHEUS_IMAGE}
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/rules:/etc/prometheus/rules:ro
      - ../observability/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"]
    networks: [private]

  grafana:
    image: ${GRAFANA_IMAGE:?set GRAFANA_IMAGE}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [private]

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
