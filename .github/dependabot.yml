version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Vienna
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Vienna
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Vienna
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /.devcontainer
      - /infra/docker
      - /infra/docs
      - /tests/fixtures/invalid_subject_oidc
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Vienna
    open-pull-requests-limit: 5
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
