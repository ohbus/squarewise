version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Vienna
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Vienna
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Vienna
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /tests/fixtures/invalid_subject_oidc
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Vienna
    groups:
      fixture-python-minor-and-patch:
        update-types: [minor, patch]

  # Best-effort Docker coverage; ARG/env indirection remains guarded by sbom-validate.
  - package-ecosystem: docker
    directories:
      - /.devcontainer
      - /infra/docker
      - /infra/docs
      - /tests/fixtures/invalid_subject_oidc
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Vienna
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
