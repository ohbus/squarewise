name: Squarewise branch CI
on:
  push:
    branches-ignore: [master]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  id-token: write
  attestations: write
concurrency:
  group: squarewise-branch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: Feature branch verification (reusable)
    uses: ./.github/workflows/_reusable-ci.yml
    with:
      run_e2e: true
      full_run: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit
