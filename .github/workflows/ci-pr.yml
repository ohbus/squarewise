name: Squarewise PR CI
on: { pull_request: {} }
permissions:
  contents: read
  pull-requests: read
  id-token: write
  attestations: write
concurrency:
  group: squarewise-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ci:
    name: Pull request verification (reusable)
    uses: ./.github/workflows/_reusable-ci.yml
    with:
      run_e2e: true
      full_run: false
    secrets: inherit
