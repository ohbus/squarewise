name: Squarewise master CI and images
on:
  push: { branches: [master] }
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency: { group: squarewise-master, cancel-in-progress: false }
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  ci:
    name: Master verification (reusable)
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_reusable-ci.yml
    with:
      run_e2e: true
      full_run: true
    secrets: inherit

  images:
    name: Publish container images
    needs: ci
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    strategy:
      matrix: { service: [accounts, expense-core, notifications, bff] }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download application jar artifact
        uses: actions/download-artifact@v8
        with:
          name: app-jar-${{ matrix.service }}
          path: app/${{ matrix.service }}/build/libs
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx with GHA cache support
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/squarewise-${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile.fast
          build-args: APP_PROJECT=${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Attest container image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/squarewise-${{ matrix.service }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
