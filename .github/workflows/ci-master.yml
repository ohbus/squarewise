name: Squarewise master CI and images
on:
  push: { branches: [master] }
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  pull-requests: read
  id-token: write
  attestations: write
concurrency: { group: squarewise-master, cancel-in-progress: false }
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  ci:
    name: Master verification (reusable)
    uses: ./.github/workflows/_reusable-ci.yml
    with:
      run_e2e: true
      full_run: true
    secrets: inherit

  images:
    name: Publish container images
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    strategy:
      matrix: { service: [accounts, expense-core, notifications, bff] }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download application jar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar-${{ matrix.service }}
          path: app/${{ matrix.service }}/build/libs
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx with GHA cache support
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/squarewise-${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: infra/docker/Dockerfile.fast
          build-args: APP_PROJECT=${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Attest container image
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/squarewise-${{ matrix.service }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
