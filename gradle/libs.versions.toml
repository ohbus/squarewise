[versions]
kotlin = "2.4.20"
springBoot = "4.1.1"
springDependencyManagement = "1.1.7"
postgresql = "42.7.8"
flyway = "11.13.0"
h2 = "2.4.240"
uuidCreator = "6.1.1"
junitPlatform = "6.0.3"
spotless = "8.1.0"
cyclonedx = "3.4.1"
kotlinxCoroutines = "1.7.3"
sonarqube = "7.5.0.8588"
[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }

[libraries]
boot-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "springBoot" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
boot-amqp = { module = "org.springframework.boot:spring-boot-starter-amqp", version.ref = "springBoot" }
boot-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "springBoot" }
boot-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "springBoot" }
boot-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server", version.ref = "springBoot" }
boot-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "springBoot" }
boot-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis", version.ref = "springBoot" }
boot-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway", version.ref = "springBoot" }
boot-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBoot" }
boot-graphql = { module = "org.springframework.boot:spring-boot-starter-graphql", version.ref = "springBoot" }
boot-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux", version.ref = "springBoot" }
boot-webclient = { module = "org.springframework.boot:spring-boot-starter-webclient", version.ref = "springBoot" }
boot-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBoot" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuidCreator" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
